name: openshot-qt CI Build
# The original 2.6.1-era workflow froze the full app on ubuntu-18.04/20.04
# with the libopenshot daily PPA; those runners no longer exist and the
# era-matched PPA packages are gone, so a full freeze can't run here anymore.
# (The Windows Package workflow builds the distributable app instead.)
# This workflow keeps CI meaningful: byte-compile all sources and run the
# dependency-free unit tests, on Linux and on Windows with the same Python
# 3.8 the frozen Windows app ships.
on: [push, pull_request]
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.8"
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Compile all sources
      run: python -m compileall -q src

    - name: Run OCCLUDE wrapper tests
      run: python src/tests/occlude_wrapper_tests.py
